spring:
  application:
    name: "gatewayserver"
  config:
    import: "optional:configserver:http://localhost:8071/"
  cloud:
    gateway:
#      discovery:
#        locator:
#          enabled: true
#          lowerCaseServiceId: true
      httpclient:
        connect-timeout: 1000
        response-timeout: 10s
    kubernetes:
      discovery:
        all-namespaces: true
        enabled: true
        discovery-server-url: http://spring-cloud-kubernetes-discoveryserver.default.svc.cluster.local:80
    discovery:
      client:
        composite-indicator:
          enabled: true
    config:
      enabled: true
  data:
    redis:
      connect-timeout: 2s
      host: localhost
      port: 9000
      timeout: 1s
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: "http://localhost:7080/realms/master/protocol/openid-connect/certs"

logging:
  level:
    com:
      bank:
        gatewayserver: debug

#accept all api actuators
management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  info:
    env:
      enabled: true
  endpoint:
    gateway:
      access: unrestricted
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: "gatewayserver"
    description: "managing bank gatewayserver."
    version: "1.0.0"

resilience4j.circuitbreaker:
  configs:
    default:
      slidingWindowSize: 10
      permittedNumberOfCallsInHalfOpenState: 2
      failureRateThreshold: 50
      waitDurationInOpenState: 10000

