apiVersion: apps/v1
kind: Deployment
metadata:
  name: cardsdb
  labels:
    app: cardsdb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cardsdb
  template:
    metadata:
      labels:
        app: cardsdb
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: CARD_DATABASE
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: PASS_DB
          ports:
            - name: mysql
              containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: cardsdb
  labels:
    app: cardsdb
spec:
  selector:
    app: cardsdb
  type: ClusterIP
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306


