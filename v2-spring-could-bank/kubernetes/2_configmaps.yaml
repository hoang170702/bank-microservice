apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap
data:
  # ===== DATABASE CONFIGS =====
  ACCOUNT_DATABASE: "accountsdb"
  LOANS_DATABASE: "loansdb"
  CARD_DATABASE: "cardsdb"
  USER_DB: "root"
  PASS_DB: "root"

  # Kết nối MySQL cho ứng dụng
  SPRING_ACCOUNT_DATASOURCE_URL: "jdbc:mysql://localhost:3306/accountsdb"
  SPRING_LOAN_DATASOURCE_URL: "jdbc:mysql://loansdb:3306/accountsdb"
  SPRING_CARD_DATASOURCE_URL: "jdbc:mysql://cardsdb:3306/accountsdb"

  # ===== SPRING CLOUD CONFIG =====
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_CONFIG_IMPORT: "configserver:http://configserver:8071/"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eurekaserver:8070/eureka/"

  # ===== SERVICE NAMES =====
  CONFIGSERVER_APPLICATION_NAME: "configserver"
  EUREKA_APPLICATION_NAME: "eurekaserver"
  ACCOUNTS_APPLICATION_NAME: "accounts"
  LOANS_APPLICATION_NAME: "loans"
  CARDS_APPLICATION_NAME: "cards"
  GATEWAY_APPLICATION_NAME: "gatewayserver"

  # ===== KEYCLOAK / SECURITY =====
  KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
  KC_BOOTSTRAP_ADMIN_PASSWORD: "admin"
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: "http://keycloak:7080/realms/master/protocol/openid-connect/certs"
