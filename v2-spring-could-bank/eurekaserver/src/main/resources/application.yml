spring:
  application:
    name: "eurekaserver"
  config:
    import: "optional:configserver:http://localhost:8071/"
#accept all api actuators
management:
  endpoints:
    web:
      exposure:
        include: "*"
  #config to enable liveness and readiness
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    com:
      bank:
        eurekaserver: debug
